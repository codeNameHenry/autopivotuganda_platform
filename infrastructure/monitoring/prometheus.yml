# Prometheus Configuration for Monitoring
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'listing-service'
    static_configs:
      - targets: ['listing-service:8001']
    metrics_path: '/metrics'

  - job_name: 'advantage-engine'
    static_configs:
      - targets: ['advantage-engine:8002']
    metrics_path: '/metrics'

  - job_name: 'logistics-service'
    static_configs:
      - targets: ['logistics-service:8003']
    metrics_path: '/metrics'

  - job_name: 'chat-service'
    static_configs:
      - targets: ['chat-service:8004']
    metrics_path: '/metrics'

  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres:5432']

  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']

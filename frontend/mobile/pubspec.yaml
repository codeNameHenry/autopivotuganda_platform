name: autopivot_mobile
description: AutoPivot Uganda Mobile Application (Flutter)
version: 0.1.0

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  provider: ^6.0.0
  riverpod: ^2.4.0
  riverpod_generator: ^2.3.0
  
  # HTTP
  dio: ^5.3.0
  http: ^1.1.0
  
  # Database
  sqflite: ^2.3.0
  drift: ^2.13.0
  
  # UI
  google_maps_flutter: ^2.5.0
  mapbox_gl: ^0.16.0
  flutter_svg: ^2.0.0
  cached_network_image: ^3.3.0
  
  # Camera & Media
  image_picker: ^1.0.0
  camera: ^0.10.0
  video_player: ^2.8.0
  
  # Location
  geolocator: ^9.0.0
  geolocation: ^6.2.0
  
  # Authentication
  firebase_auth: ^4.10.0
  google_sign_in: ^6.1.0
  
  # Push Notifications
  firebase_messaging: ^14.6.0
  flutter_local_notifications: ^16.1.0
  
  # Payments
  stripe_flutter: ^9.4.0
  razorpay_flutter: ^1.3.0
  
  # Utilities
  intl: ^0.18.0
  connectivity_plus: ^5.0.0
  shared_preferences: ^2.2.0
  get_it: ^7.6.0
  logger: ^1.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.0
  riverpod_generator: ^2.3.0

flutter:
  uses-material-design: true
